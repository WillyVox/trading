<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">What is trading?</title>
  <desc id="desc">Diagram of how a trade travels from an investor through a broker to an exchange, next to a rising and falling price chart.</desc>
  <rect width="1200" height="630" fill="#16233f" />
  <line x1="80" y1="200" x2="1120" y2="200" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <line x1="80" y1="360" x2="1120" y2="360" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <rect x="80" y="500" width="230" height="46" rx="23" fill="none" stroke="#c79a3d" stroke-width="3" />
  <text x="112" y="530" font-family="'DejaVu Sans', Arial, sans-serif" font-weight="700" font-size="22" fill="#f5f2ea">GUIDES</text>

  <text x="80" y="120" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="46" fill="#f5f2ea">What Is Trading?</text>
  <text x="80" y="170" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="46" fill="#f5f2ea">A Beginner's Guide</text>

  <!-- order -> broker -> exchange path -->
  <line x1="120" y1="420" x2="600" y2="420" stroke="#f5f2ea" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="160" cy="420" r="28" fill="#c79a3d" />
  <text x="160" y="429" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-weight="700" font-size="15" fill="#16233f">ORDER</text>
  <circle cx="360" cy="420" r="28" fill="none" stroke="#c79a3d" stroke-width="3" />
  <text x="360" y="429" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#e8d9b5">BROKER</text>
  <circle cx="560" cy="420" r="28" fill="none" stroke="#c79a3d" stroke-width="3" />
  <text x="560" y="426" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#e8d9b5">EXCHANGE</text>

  <!-- price line with candles, rising then falling -->
  <g>
    <rect x="700" y="330" width="18" height="70" fill="#e8d9b5" />
    <rect x="740" y="290" width="18" height="110" fill="#c79a3d" />
    <rect x="780" y="240" width="18" height="90" fill="#e8d9b5" />
    <rect x="820" y="200" width="18" height="80" fill="#c79a3d" />
    <rect x="860" y="230" width="18" height="60" fill="#e8d9b5" />
    <rect x="900" y="260" width="18" height="50" fill="#c79a3d" />
    <polyline points="709,330 749,290 789,240 829,200 869,230 909,260" fill="none" stroke="#f5f2ea" stroke-width="3" stroke-linecap="round" />
  </g>

  <circle cx="1040" cy="150" r="70" fill="#c79a3d" stroke="#16233f" stroke-width="4" />
  <text x="1040" y="178" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="72" fill="#16233f">%</text>
</svg>
