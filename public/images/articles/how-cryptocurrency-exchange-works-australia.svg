<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">How a cryptocurrency exchange works in Australia</title><desc id="desc">Flow diagram from an Australian bank account through an exchange to a crypto purchase, exchange wallet and optional personal wallet.</desc><rect width="1200" height="630" fill="#16233a"/><text x="600" y="88" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="38" font-weight="700">How a crypto exchange fits into the journey</text><text x="600" y="126" text-anchor="middle" fill="#d9c48f" font-family="Arial" font-size="20">A simplified beginner view — actual methods and fees vary.</text><g font-family="Arial" text-anchor="middle"><g transform="translate(70 235)"><rect width="210" height="150" rx="18" fill="#fff"/><text x="105" y="65" fill="#16233a" font-size="23" font-weight="700">Australian bank</text><text x="105" y="103" fill="#6b7280" font-size="18">AUD</text></g><g transform="translate(370 210)"><rect width="240" height="200" rx="18" fill="#eef1f5"/><text x="120" y="66" fill="#16233a" font-size="25" font-weight="700">Crypto exchange</text><text x="120" y="108" fill="#6b7280" font-size="18">deposit · order · trade</text><text x="120" y="148" fill="#b6924f" font-size="18" font-weight="700">fees may apply</text></g><g transform="translate(700 235)"><rect width="190" height="150" rx="18" fill="#fff"/><text x="95" y="64" fill="#16233a" font-size="23" font-weight="700">BTC / ETH</text><text x="95" y="103" fill="#6b7280" font-size="18">exchange wallet</text></g><g transform="translate(965 235)"><rect width="180" height="150" rx="18" fill="#d9c48f"/><text x="90" y="60" fill="#16233a" font-size="21" font-weight="700">Personal wallet</text><text x="90" y="99" fill="#16233a" font-size="17">optional withdrawal</text></g></g><g stroke="#b6924f" stroke-width="7" stroke-linecap="round" fill="none"><path d="M290 310 H350"/><path d="M625 310 H680"/><path d="M905 310 H945"/></g><g fill="#b6924f"><path d="M350 310 l-20 -14 v28z"/><path d="M680 310 l-20 -14 v28z"/><path d="M945 310 l-20 -14 v28z"/></g><text x="320" y="292" text-anchor="middle" fill="#d9c48f" font-family="Arial" font-size="15">deposit</text><text x="652" y="292" text-anchor="middle" fill="#d9c48f" font-family="Arial" font-size="15">buy</text><text x="925" y="292" text-anchor="middle" fill="#d9c48f" font-family="Arial" font-size="15">withdraw</text></svg>
